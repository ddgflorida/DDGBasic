[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ddgbasic"
dynamic = ["version"]
description = "A procedural BASIC around SQLite and DuckDB: SQL in the program, loops over query results, text screens and an IDE"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Bailey" }]
keywords = ["basic", "sqlite", "duckdb", "sql", "etl", "interpreter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Other",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Database",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "requests",
    "duckdb>=1.2",
    "numpy",
    "xlrd3",
    "openpyxl",
    "beautifulsoup4",
    "lxml",
    "xmltodict",
    "pyarrow",
]

[project.urls]
Homepage = "https://github.com/ddgflorida/DDGBasic"
Documentation = "https://github.com/ddgflorida/DDGBasic/blob/main/docs/manual/README.md"
Examples = "https://github.com/ddgflorida/DDGBasic/blob/main/examples/README.md"
Issues = "https://github.com/ddgflorida/DDGBasic/issues"

[project.scripts]
ddgbasic = "ddgbasic:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["ddgbasic", "ddgscreen", "ddgide", "ddgreport", "ddgformgen"]

[tool.setuptools.dynamic]
version = { attr = "ddgbasic.__version__" }
