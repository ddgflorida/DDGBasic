[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbbasic"
dynamic = ["version"]
description = "A procedural BASIC around SQLite and DuckDB: SQL in the program, loops over query results, text screens and an IDE"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dan Bailey" }]
keywords = ["basic", "sqlite", "duckdb", "sql", "etl", "interpreter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Other",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Database",
    "Topic :: Software Development :: Interpreters",
]
dependencies = [
    "requests",
    "duckdb>=1.2",
    "numpy",
    "xlrd3",
    "openpyxl",
    "beautifulsoup4",
    "lxml",
    "xmltodict",
    "pyarrow",
]

[project.scripts]
dbbasic = "dbbasic:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["dbbasic", "dbscreen", "dbide", "dbreport", "dbformgen"]

[tool.setuptools.dynamic]
version = { attr = "dbbasic.__version__" }
